<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #fff;
        }

        .phone {
            width: 360px;
            min-height: 700px;
            margin: 30px auto;
            background: #fafafa;
            border: 1px solid #ddd;
        }

        .topbar {
            height: 55px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #eee;
            color: #777;
            font-size: 13px;
        }

        .back {
            font-size: 25px;
            margin-right: 12px;
        }

        .content {
            padding: 35px 25px;
        }

        input {
            width: 100%;
            height: 42px;
            margin-bottom: 15px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        input:focus {
            border-color: #70aebe;
        }

        button {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 4px;
            background: #6faabd;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #5d9cad;
        }

        .message {
            margin-top: 50px;
            text-align: center;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="phone">

    <div class="topbar">
        <span class="back">‹</span>
        Android Compact - 13
    </div>

    <div class="content">

        <input type="text" placeholder="Username">

        <input type="text" placeholder="Confirm Username">

        <input type="password" placeholder="Password">

        <input type="password" placeholder="Confirm Password">

        <button>
            Create Account
        </button>

        <div class="message">
            Account created successfully
        </div>

    </div>

</div>

</body>
</html>
