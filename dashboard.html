<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalBestHub - Dashboard</title>
    <link rel="stylesheet" href="dashb.css">
</head>

<body>

<div class="phone">

    <header>

        <h1>LocalBestHub</h1>

        <span>Profile</span>

    </header>

    <main>

        <input
            class="search"
            type="text"
            placeholder="Search local businesses..."
        >

        <h2>Categories</h2>

        <div class="categories">

            <div class="category">
                🍔
                <span>Restaurants</span>
            </div>

            <div class="category">
                🏨
                <span>Hotels</span>
            </div>

            <div class="category">
                🔧
                <span>Services</span>
            </div>

            <div class="category">
                🛍️
                <span>Shopping</span>
            </div>

        </div>

        <h2 class="popular-title">
            Popular Near You
        </h2>

        <div class="business">

            <h3>Best Local Restaurant</h3>

            <p>
                Restaurant • Manila
            </p>

            <div class="rating">
                ★★★★★ <span>4.8</span>
            </div>

        </div>

        <div class="business">

            <h3>City Coffee Shop</h3>

            <p>
                Coffee Shop • Manila
            </p>

            <div class="rating">
                ★★★★☆ <span>4.6</span>
            </div>

        </div>

        <div class="business">

            <h3>Local Home Services</h3>

            <p>
                Home Services • Manila
            </p>

            <div class="rating">
                ★★★★★ <span>4.9</span>
            </div>

        </div>

    </main>

</div>

</body>
</html>
